<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiLink — Your Solution</title>
    <meta name="description" content="HiLink brings together workspace, property and asset management, business services and operational support under one relationship." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Only the home page opens on this photograph; preload it there alone.
      if (/^\/(en|vi)?\/?$/.test(location.pathname)) {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high';
        l.href = '/photos/f15-lounge-wide-xl.webp';
        l.imageSrcset = '/photos/f15-lounge-wide-xl-800.webp 800w, /photos/f15-lounge-wide-xl-1200.webp 1200w, /photos/f15-lounge-wide-xl.webp 1600w';
        l.imageSizes = '100vw';
        document.head.appendChild(l);
      }
    </script>
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
